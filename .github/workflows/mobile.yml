name: Mobile - Sauce Labs

on:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-catalogo:
    name: Catálogo de Produtos (iOS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Mobile
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_APP: ${{ secrets.SAUCE_APP }}
      SAUCE_BUILD: TCC-EBAC-QE mobile - ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mobile/package-lock.json
      - run: npm ci
      - name: Executar testes no Sauce Labs
        run: npm test
      - name: Gerar relatório Allure
        if: always()
        run: npm run report
      - name: Publicar relatório Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mobile
          path: Mobile/allure-report
